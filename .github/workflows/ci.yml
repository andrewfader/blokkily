name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git cmake ninja ccache pkgconf \
            qt6-base qt6-declarative qt6-shadertools qt6-svg \
            fluidsynth rtaudio rtmidi libsndfile libsamplerate rubberband \
            alsa-lib freetype2 libx11 libxext libxrandr libxinerama libxcursor \
            freewheeling ttf-dejavu fontconfig

      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ci-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-ci-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}-
            ccache-ci-${{ runner.os }}-

      - name: Initialize ccache
        run: |
          ccache -M 2G
          ccache -z

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Show ccache statistics
        run: ccache -s

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            build/artifacts/
            build/Testing/Temporary/
          if-no-files-found: ignore
