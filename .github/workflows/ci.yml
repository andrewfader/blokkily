name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Arch Linux, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    container:
      image: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git cmake ninja ccache pkgconf \
            qt6-base qt6-declarative qt6-shadertools qt6-svg \
            fluidsynth rtaudio rtmidi libsndfile libsamplerate rubberband \
            alsa-lib freetype2 libx11 libxext libxi libxrandr libxinerama \
            libxcursor libxrender libxcomposite \
            freewheeling ttf-dejavu fontconfig

      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ci-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-ci-${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}-
            ccache-ci-${{ runner.os }}-${{ matrix.build_type }}-

      - name: Initialize ccache
        run: |
          ccache -M 2G
          ccache -z

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      - name: Show ccache statistics
        run: ccache -s

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure

      # Every push gets installable packages, not only tagged releases; the
      # tag-driven release.yml still publishes the GitHub Release itself.
      - name: Build Packages with CPack
        if: matrix.build_type == 'Release'
        run: |
          cmake --build build --target package package_source
          cd build
          sha256sum blokkily-*.tar.* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Release Packages
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: blokkily-linux-${{ github.sha }}
          path: |
            build/blokkily-*.tar.*
            build/SHA256SUMS
          if-no-files-found: error

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.build_type }}
          path: |
            build/artifacts/
            build/Testing/Temporary/
          if-no-files-found: ignore
