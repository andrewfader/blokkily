name: Platforms

# Windows and macOS are not supported yet. These legs show how far each
# platform gets (configure, build, tests) without blocking anything: a failing
# leg is reported, but the run still passes. Once a platform is green, move it
# into ci.yml and drop continue-on-error.

on:
  push:
    branches:
      - main
      - 'ci/**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # The suite's test SoundFont, which Arch gets from the freewheeling package.
  # Pinned to an upstream commit and checked, so the fixture cannot drift.
  TEST_SF2_URL: https://raw.githubusercontent.com/free-wheeling/freewheeling/2ec066ee67614300a8b3dc61de7d059971883747/data/basic.sf2
  TEST_SF2_SHA256: 2e6cf4a8a1d78e6be3b00a0c22358d3ceec8c5a27a000714e65215e3f9b1d15a

jobs:
  windows:
    # JUCE refuses MinGW, so Windows builds with MSVC: dependencies from
    # vcpkg, Qt from the official binaries, pkg-config from vcpkg's pkgconf.
    name: Windows (MSVC, experimental)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      VCPKG_TRIPLET: x64-windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-fluidsynth-rtaudio-rtmidi-pkgconf-v1

      - name: Install dependencies with vcpkg
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet "$VCPKG_TRIPLET" fluidsynth rtaudio rtmidi pkgconf
          root="$(cygpath -m "$VCPKG_INSTALLATION_ROOT/installed/$VCPKG_TRIPLET")"
          echo "VCPKG_ROOT_DIR=$root" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$root/lib/pkgconfig;$root/share/pkgconfig" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$root/bin")" >> "$GITHUB_PATH"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch test SoundFont
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o basic.sf2 "$TEST_SF2_URL"
          echo "$TEST_SF2_SHA256  basic.sf2" | sha256sum -c -

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_ROOT_DIR");$VCPKG_ROOT_DIR" \
            -DPKG_CONFIG_EXECUTABLE="$VCPKG_ROOT_DIR/tools/pkgconf/pkgconf.exe" \
            -DBLOKKILY_TEST_SF2="$PWD/basic.sf2" 2>&1 | tee configure.log

      # -k 0 keeps going past the first failure, so one run lists every
      # translation unit that does not yet compile here.
      - name: Build
        run: cmake --build build -- -k 0 2>&1 | tee build.log

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log

      # The failing step's errors as annotations, readable from the run page
      # and the checks API without downloading the full log.
      - name: Report errors
        if: failure()
        run: |
          # Only the diagnostic lines, not the compile commands around them,
          # split so no annotation is long enough for GitHub to truncate.
          for f in configure.log build.log test.log; do
            [ -f "$f" ] || continue
            tr -d '\r' < "$f" | grep -E "CMake Error|^FAILED|error|Undefined symbols|referenced from|^ld:|\*\*\*Failed|Not Run|tests passed|Could not find|not found" \
              | grep -vE "^(/usr/bin/|\[[0-9]+/[0-9]+\])" | awk '!seen[$0]++' | cut -c1-400 > errors.txt || true
            # CMake's errors need their context; the end of a failed
            # configure is where it is.
            [ "$f" != configure.log ] || tail -n 80 "$f" | cut -c1-400 > errors.txt
            [ -s errors.txt ] || tail -n 60 "$f" | cut -c1-400 > errors.txt
            split -l 40 errors.txt chunk.
            n=0
            for c in chunk.*; do
              n=$((n + 1)); [ $n -le 9 ] || break
              echo "::error title=$f ($n)::$(sed 's/%/%25/g' "$c" | awk '{printf "%s%%0A", $0}')"
            done
            rm -f chunk.*
          done

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-windows
          path: |
            build/artifacts/
            build/Testing/Temporary/
          if-no-files-found: ignore

  macos:
    name: macOS (Homebrew, experimental)
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        # bash here means bash -eo pipefail, so a step piped through tee
        # still fails.
        shell: bash
    steps:
      - name: Install dependencies
        run: brew install ninja pkgconf qt fluid-synth rtaudio rtmidi libsndfile libsamplerate rubberband

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch test SoundFont
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o basic.sf2 "$TEST_SF2_URL"
          echo "$TEST_SF2_SHA256  basic.sf2" | shasum -a 256 -c -

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DBLOKKILY_TEST_SF2="$PWD/basic.sf2" 2>&1 | tee configure.log

      - name: Build
        run: cmake --build build -- -k 0 2>&1 | tee build.log

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure 2>&1 | tee test.log

      # The failing step's errors as annotations, readable from the run page
      # and the checks API without downloading the full log.
      - name: Report errors
        if: failure()
        run: |
          # Only the diagnostic lines, not the compile commands around them,
          # split so no annotation is long enough for GitHub to truncate.
          for f in configure.log build.log test.log; do
            [ -f "$f" ] || continue
            tr -d '\r' < "$f" | grep -E "CMake Error|^FAILED|error|Undefined symbols|referenced from|^ld:|\*\*\*Failed|Not Run|tests passed|Could not find|not found" \
              | grep -vE "^(/usr/bin/|\[[0-9]+/[0-9]+\])" | awk '!seen[$0]++' | cut -c1-400 > errors.txt || true
            # CMake's errors need their context; the end of a failed
            # configure is where it is.
            [ "$f" != configure.log ] || tail -n 80 "$f" | cut -c1-400 > errors.txt
            [ -s errors.txt ] || tail -n 60 "$f" | cut -c1-400 > errors.txt
            split -l 40 errors.txt chunk.
            n=0
            for c in chunk.*; do
              n=$((n + 1)); [ $n -le 9 ] || break
              echo "::error title=$f ($n)::$(sed 's/%/%25/g' "$c" | awk '{printf "%s%%0A", $0}')"
            done
            rm -f chunk.*
          done

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-macos
          path: |
            build/artifacts/
            build/Testing/Temporary/
          if-no-files-found: ignore
