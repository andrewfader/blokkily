name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Release)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git cmake ninja ccache pkgconf \
            qt6-base qt6-declarative qt6-shadertools qt6-svg \
            fluidsynth rtaudio rtmidi libsndfile libsamplerate rubberband \
            alsa-lib freetype2 libx11 libxext libxrandr libxinerama libxcursor \
            freewheeling ttf-dejavu fontconfig

      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-release-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-release-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}-
            ccache-release-${{ runner.os }}-

      - name: Initialize ccache
        run: |
          ccache -M 2G
          ccache -z

      - name: Configure CMake (Release)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure

      - name: Build Packages with CPack
        run: cmake --build build --target package

      - name: Generate SHA256 Checksums
        run: |
          cd build
          sha256sum blokkily-*.tar.* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Release Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            build/blokkily-*.tar.*
            build/SHA256SUMS

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist

      - name: Determine Tag Name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
