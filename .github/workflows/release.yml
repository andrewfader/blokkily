name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Release)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          # One slow mirror timing out once failed a whole run before
          # anything was built. pacman moves to the next server in the list
          # for a file it cannot fetch, and each step is tried again.
          cat > /etc/pacman.d/mirrorlist <<'MIRRORS'
          Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
          Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch
          Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          MIRRORS
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "attempt $attempt failed: $*"
              sleep 20
            done
            return 1
          }
          retry pacman -Sy --noconfirm archlinux-keyring
          retry pacman -Syu --noconfirm
          retry pacman -S --noconfirm --needed \
            git cmake ninja ccache pkgconf \
            qt6-base qt6-declarative qt6-shadertools qt6-svg \
            fluidsynth rtaudio rtmidi libsndfile libsamplerate rubberband \
            alsa-lib freetype2 libx11 libxext libxi libxrandr libxinerama \
            libxcursor libxrender libxcomposite \
            freewheeling ttf-dejavu fontconfig

      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-release-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-release-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}-
            ccache-release-${{ runner.os }}-

      - name: Initialize ccache
        run: |
          ccache -M 2G
          ccache -z

      - name: Configure CMake (Release)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure

      - name: Build Packages with CPack
        run: cmake --build build --target package

      - name: Generate SHA256 Checksums
        run: |
          cd build
          sha256sum blokkily-*.tar.* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Release Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            build/blokkily-*.tar.*
            build/SHA256SUMS

  windows:
    # The same toolchain as the Windows leg in platforms.yml: MSVC, vcpkg
    # dependencies and the official Qt binaries.
    name: Build & Package (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VCPKG_TRIPLET: x64-windows
      TEST_SF2_URL: https://raw.githubusercontent.com/free-wheeling/freewheeling/2ec066ee67614300a8b3dc61de7d059971883747/data/basic.sf2
      TEST_SF2_SHA256: 2e6cf4a8a1d78e6be3b00a0c22358d3ceec8c5a27a000714e65215e3f9b1d15a
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/platforms.yml') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install dependencies with vcpkg
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet "$VCPKG_TRIPLET" fluidsynth rtaudio rtmidi libsndfile libsamplerate rubberband pkgconf
          root="$(cygpath -m "$VCPKG_INSTALLATION_ROOT/installed/$VCPKG_TRIPLET")"
          echo "VCPKG_ROOT_DIR=$root" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$root/lib/pkgconfig;$root/share/pkgconfig" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$root/bin")" >> "$GITHUB_PATH"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch test SoundFont
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o basic.sf2 "$TEST_SF2_URL"
          echo "$TEST_SF2_SHA256  basic.sf2" | sha256sum -c -

      - name: Configure CMake (Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$QT_ROOT_DIR");$VCPKG_ROOT_DIR" \
            -DPKG_CONFIG_EXECUTABLE="$VCPKG_ROOT_DIR/tools/pkgconf/pkgconf.exe" \
            -DBLOKKILY_TEST_SF2="$PWD/basic.sf2"

      - name: Build
        run: cmake --build build

      - name: Run Test Suite
        run: ctest --test-dir build --output-on-failure

      # The install tree, made self-contained: Qt and its QML imports through
      # windeployqt, the vcpkg libraries and the MSVC runtime beside them.
      - name: Package
        run: |
          version="$(sed -n 's/^project(blokkily VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          name="blokkily-$version-Windows-x64"
          cmake --install build --prefix "stage/$name"
          bin="stage/$name/bin"
          cp "$VCPKG_ROOT_DIR"/bin/*.dll "$bin/"
          windeployqt --release --no-compiler-runtime --qmldir ui "$bin/blokkily.exe"
          # The MSVC runtime as DLLs beside the executables, not as an
          # installer the user would have to run first.
          cp "$(cygpath -u "$VCToolsRedistDir")"/x64/Microsoft.VC*.CRT/*.dll "$bin/"
          ls "$bin"/vcruntime140.dll "$bin"/msvcp140.dll
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      # The packaged application, not the build tree, runs the end-to-end
      # gate's own command and environment with nothing but Windows itself
      # on PATH and no Qt search paths, so a library or QML import left out
      # of the archive fails here rather than on a user's machine. It runs
      # from a copy that adds only the offscreen platform the gate draws on.
      - name: Smoke-test the package
        run: |
          cp -r "stage/$PACKAGE" smoke-app
          mkdir -p smoke-app/bin/platforms
          cp "$QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" smoke-app/bin/platforms/
          ctest --test-dir build --show-only=json-v1 > tests.json
          python - "$(cygpath -m "$PWD/smoke-app/bin/blokkily.exe")" > smoke.sh <<'PY'
          import json, shlex, sys
          test = next(t for t in json.load(open("tests.json"))["tests"]
                      if t["name"] == "bdd_edit_once_see_everywhere")
          props = {p["name"]: p["value"] for p in test.get("properties", [])}
          command = [sys.argv[1]] + test["command"][1:]
          command = [a.replace("edit-once-see-everywhere.png", "package-smoke.png") for a in command]
          print("cd " + shlex.quote(props.get("WORKING_DIRECTORY", ".")))
          env = ["-u", "QT_PLUGIN_PATH", "-u", "QML2_IMPORT_PATH", "-u", "QT_ROOT_DIR",
                 "PATH=/c/Windows/system32:/c/Windows"] + props.get("ENVIRONMENT", [])
          print("env " + " ".join(shlex.quote(a) for a in env + command))
          PY
          cat smoke.sh
          bash smoke.sh
          test -s build/artifacts/package-smoke.png

      - name: Archive
        run: |
          cd stage
          7z a "../$PACKAGE.zip" "$PACKAGE" > /dev/null
          cd ..
          sha256sum "$PACKAGE.zip" > SHA256SUMS-windows
          cat SHA256SUMS-windows

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            ${{ env.PACKAGE }}.zip
            SHA256SUMS-windows
            build/artifacts/package-smoke.png

  publish:
    name: Publish GitHub Release
    needs: [build, windows]
    # A dispatch on a branch without a tag name builds and packages only.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist

      - name: Download Windows Package
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: windows

      - name: Merge Checksums
        run: |
          mv windows/*.zip dist/
          cat windows/SHA256SUMS-windows >> dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Determine Tag Name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
